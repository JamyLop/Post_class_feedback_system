name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pfs
          POSTGRES_PASSWORD: pfs
          POSTGRES_DB: pfs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pfs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装依赖
        working-directory: backend
        run: pip install -r requirements.txt
      - name: 初始化测试库
        working-directory: backend
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: pfs
          PGPASSWORD: pfs
        run: |
          psql -h 127.0.0.1 -U pfs -d pfs -c 'CREATE SCHEMA IF NOT EXISTS tests'
      - name: 后端测试
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 前端构建检查
        working-directory: frontend
        run: npm run build