services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pfs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pfs}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pfs}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    environment:
      # 敏感值由部署平台 / CI Secret 注入，禁止把开发 .env 整体带进生产容器。
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY through the deployment secret store}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to the deployed frontend origins}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pfs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pfs}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LOG_DIR: /app/logs
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oss}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-oss-cn-beijing.aliyuncs.com}
      OSS_BUCKET: ${OSS_BUCKET:-xueshengyian}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-240}
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OCR_PROVIDER: ${OCR_PROVIDER:-mock}
      OCR_API_KEY: ${OCR_API_KEY:-}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - applogs:/app/logs
      - uploads:/app/local_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build: ./backend
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY through the deployment secret store}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to the deployed frontend origins}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pfs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pfs}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LOG_DIR: /app/logs
      STORAGE_BACKEND: ${STORAGE_BACKEND:-oss}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-oss-cn-beijing.aliyuncs.com}
      OSS_BUCKET: ${OSS_BUCKET:-xueshengyian}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-240}
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OCR_PROVIDER: ${OCR_PROVIDER:-mock}
      OCR_API_KEY: ${OCR_API_KEY:-}
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO
    volumes:
      - applogs:/app/logs
      - uploads:/app/local_storage
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app.celery_app inspect ping | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  redisdata:
  applogs:
  uploads:
