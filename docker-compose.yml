version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pfs-postgres
    environment:
      POSTGRES_USER: pfs
      POSTGRES_PASSWORD: pfs
      POSTGRES_DB: pfs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pfs-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: pfs-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pfs
      MINIO_ROOT_PASSWORD: pfs123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
